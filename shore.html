<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shore dive detail — UK Shore Dives</title>
<link rel="stylesheet" href="style.css">
<style>
  .panel{background:var(--panel);border:1px solid var(--panelb);border-radius:14px;padding:16px 18px;margin:8px 18px;backdrop-filter:blur(6px)}
  .nowgrid{display:flex;flex-wrap:wrap;gap:26px;align-items:center}
  .metric{display:flex;flex-direction:column;gap:2px}
  .metric .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
  .metric .v{font-size:20px;font-weight:700}
  .h2{margin:22px 18px 6px;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--cyan)}
  .h2::before{content:"\25B8  "}
  .days{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .day{border:1px solid var(--panelb);border-radius:10px;padding:10px;text-align:center;border-left:4px solid #33415a;background:rgba(255,255,255,.02)}
  .day .d{font-weight:700;font-size:13px}.day .s{font-size:11px;color:var(--mut);margin-top:4px}
  .detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
  .card{background:rgba(255,255,255,.03);border:1px solid var(--panelb);border-radius:10px;padding:10px 12px}
  .card.wide{grid-column:1/-1}
  .card.warn{border-color:rgba(255,93,108,.45);background:rgba(255,93,108,.06)}
  .card .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
  .card .v{font-size:14px;margin-top:4px;line-height:1.5}
  .links a{margin-right:16px}
  h1.title{margin:2px 0 2px;font-size:26px}
  .reg{color:var(--mut);font-size:14px;margin:0 0 6px}
</style>
</head>
<body>
<nav class="top">
  <span class="brand">◈ UK DIVE SITES</span>
  <a href="index.html">Home</a>
  <a href="wrecks.html">Wreck Dives</a>
  <a href="shores.html">Shore Dives</a>
  <a href="map.html">Map</a>
  <a href="inland.html">Inland Dives</a>
</nav>
<div id="app" class="wrap"><p class="sub" style="margin:20px">Loading…</p></div>
<footer><div id="safetybox"></div></footer>
<script src="data.js"></script>
<script>
document.getElementById('safetybox').innerHTML = safetyBannerHTML();
function qs(k){return new URLSearchParams(location.search).get(k);}
function verdictColor(v){return v===0?"var(--go)":v===1?"var(--cau)":v===2?"var(--no)":"#33415a";}
var site=SHORE.filter(function(s){return s.slug===qs("id");})[0];
function render(){
  var app=document.getElementById("app");
  if(!site){app.innerHTML="<div class='panel'><b>Shore dive not found.</b><br><a class='fc' href='shores.html'>&larr; Back to dashboard</a></div>";return;}
  app.innerHTML="<h1 class='title'>"+esc(site.n)+"</h1>"+
    "<p class='reg'>"+esc(site.r)+" &nbsp;·&nbsp; "+esc(site.type)+"</p>"+
    "<div class='panel'><div class='nowgrid' id='now'><span class='sub'>Fetching live conditions…</span></div></div>"+
    "<div class='h2'>Next 12 hours</div><div class='panel' id='twelve'><span class='sub'>—</span></div>"+
    "<div class='h2'>7-day outlook</div><div class='panel'><div class='days' id='seven'><span class='sub'>—</span></div></div>"+
    "<div class='h2'>Shore dive detail</div><div class='panel'><div class='detail' id='detail'></div></div>"+
    "<div class='h2'>Links</div><div class='panel links'>"+
      "<a class='fc' href='"+tideURL(site.r)+"' target='_blank' rel='noopener'>Tide times ↗</a>"+
      "<a class='fc' href='"+yrURL(site)+"' target='_blank' rel='noopener'>Weather forecast ↗</a>"+
      "<a class='fc' href='"+esc(site.source)+"' target='_blank' rel='noopener'>Source / more info ↗</a>"+
    "</div>";
  // details grid
  function card(l,v,opts){opts=opts||{};if(v==null||v==="")return "";return "<div class='card"+(opts.wide?" wide":"")+(opts.warn?" warn":"")+"'><div class='l'>"+esc(l)+"</div><div class='v'>"+esc(v)+"</div></div>";}
  var dep=(site.minD!=null?site.minD:"?")+"–"+(site.maxD!=null?site.maxD:"?")+" m";
  document.getElementById("detail").innerHTML=
    card("Site type",site.type)+card("Entry / access",site.entry)+card("Depth (min–max)",dep)+
    card("Diver level",site.lvl)+card("Avg water temp",site.temp?site.temp+" °C":null)+card("Best time of year",site.best)+
    card("Tidal current",site.curr)+card("Tidal / slack notes",site.tidal,{wide:true})+
    card("Typical visibility",site.viz)+card("Marine life & highlights",site.marine,{wide:true})+
    card("Hazards / cautions",site.hazards,{wide:true,warn:true})+
    card("Protected / conservation status",site.prot,{wide:true})+card("Parking & facilities",site.parking)+
    card("Nearest recompression chamber",site.chamber,{wide:true,warn:true})+card("Distance from Halifax",site.halifax)+
    card("Closest fill station",site.fill)+card("Fill → site",site.fillsite)+
    card("Notes (current status)",site.notes,{wide:true});
  // live
  fetchAll(7,[site]).then(function(d){
    var Fi=d.F[0],Mi=d.M[0],c=computeConditions(site,Fi,Mi,d.now);
    var pill="<span class='pill "+c.cls+"'>"+c.lab+"</span>";
    var wind=(c.gustKn==null)?"—":fmtWind(c.windKn)+" "+windU()+" <span class='sub'>(gust "+fmtWind(c.gustKn)+")</span>";
    var wv=waveTxt(c.wave)||"—";
    var tide=esc(c.tideMain)+(c.tideSub?" <span class='sub'>"+esc(c.tideSub)+"</span>":"");
    var day=(c.sunrise?hhmm(c.sunrise)+" – "+hhmm(c.sunset):"—");
    document.getElementById("now").innerHTML=
      "<div class='metric'><span class='l'>Dive now?</span><span class='v'>"+pill+"</span></div>"+
      "<div class='metric'><span class='l'>Wind</span><span class='v'>"+wind+"</span></div>"+
      "<div class='metric'><span class='l'>Waves</span><span class='v'>"+wv+"</span></div>"+
      "<div class='metric'><span class='l'>Tide (est)</span><span class='v'>"+tide+"</span></div>"+
      "<div class='metric'><span class='l'>Daylight</span><span class='v'>"+day+"</span></div>"+
      "<div class='metric'><span class='l'>Spring/Neap</span><span class='v'>"+springLabel(d.now)+"</span></div>";
    // 12h
    if(c.hrs&&c.hrs.length){
      var bars=c.hrs.map(function(h){return "<span class='"+(h.v<3?CLS[h.v]:'na')+"' title='"+h.t+" · g"+(h.gust==null?'—':h.gust)+"kn · "+(h.wave!=null?h.wave.toFixed(1)+'m':'—')+"'></span>";}).join("");
      var minV=Math.min.apply(null,c.hrs.map(function(h){return h.v;}));
      var best=c.hrs.filter(function(h){return h.v===minV;})[0];
      var note=minV<=1?("best <b>~"+best.t+"</b>"):(minV===2?"rough all window":"—");
      document.getElementById("twelve").innerHTML="<div class='spark'>"+bars+"</div><span class='best'>"+note+"</span>";
    }
    // 7-day
    var seven=document.getElementById("seven");
    if(Fi&&Fi.daily&&Fi.daily.time){
      var dl=Fi.daily,ml=(Mi&&Mi.daily)?Mi.daily:null,html="";
      for(var i=0;i<dl.time.length;i++){
        var gmax=(dl.wind_gusts_10m_max&&dl.wind_gusts_10m_max[i]!=null)?Math.round(dl.wind_gusts_10m_max[i]):null;
        var wmax=(ml&&ml.wave_height_max&&ml.wave_height_max[i]!=null)?ml.wave_height_max[i]:null;
        var v=(gmax==null)?3:verdict(gmax,wmax);
        var dt=new Date(dl.time[i]+"T12:00");
        var lbl=dt.toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short"});
        var gtxt=(gmax==null)?"—":fmtWind(gmax)+" "+windU();
        var wtxt=(wmax==null)?"—":(waveU()==="ft"?(wmax*3.28084).toFixed(1)+" ft":wmax.toFixed(1)+" m");
        html+="<div class='day' style='border-left-color:"+verdictColor(v)+"'>"+
          "<div class='d'>"+lbl+"</div>"+
          "<div class='s'>gust "+gtxt+"</div><div class='s'>wave "+wtxt+"</div>"+
          "<div class='s'>☀ "+hhmm(dl.sunrise[i])+"–"+hhmm(dl.sunset[i])+"</div></div>";
      }
      seven.innerHTML=html;
    }
  }).catch(function(e){
    document.getElementById("now").innerHTML="<span class='err'>Live data unavailable ("+esc(e.message)+"). Detail below is still accurate.</span>";
  });
}
render();
</script>
</body>
</html>
